version: '3.8'

services:
  # ==========================================
  # Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: stamper-tslr-backend:latest
    container_name: stamper-backend
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-change-in-production-min-32-chars
      - MODEL__CONFIDENCE_THRESHOLD=0.70
      - MODEL__FEEDBACK_BATCH_SIZE=5
      - MONITORING__LOG_LEVEL=INFO
      - MONITORING__LOG_FORMAT=json
      - MONITORING__METRICS_ENABLED=true
      - MONITORING__METRICS_PORT=9090
      - STORAGE__DATABASE_URL=postgresql://postgres:postgres@db:5432/stamper_tslr
      - STORAGE__REDIS_URL=redis://redis:6379/0
      - STORAGE__STORAGE_BACKEND=local
      - STORAGE__STORAGE_LOCAL_PATH=/app/models
      - API__HOST=0.0.0.0
      - API__PORT=8000
      - API__WORKERS=4
      - API__RELOAD=false
      - API__WS_ENABLED=true
    ports:
      - "8000:8000"
      - "9090:9090"  # Prometheus metrics
    volumes:
      - ./backend:/app  # For development with reload
      - backend_models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - stamper-network

  # ==========================================
  # Celery Worker (Async Tasks)
  # ==========================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: stamper-tslr-worker:latest
    container_name: stamper-worker
    command: celery -A tasks worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=development
      - STORAGE__DATABASE_URL=postgresql://postgres:postgres@db:5432/stamper_tslr
      - STORAGE__REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - stamper-network

  # ==========================================
  # Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    image: stamper-tslr-frontend:latest
    container_name: stamper-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - stamper-network

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: stamper-db
    environment:
      - POSTGRES_DB=stamper_tslr
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stamper_tslr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stamper-network

  # ==========================================
  # Redis Cache & Message Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: stamper-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - stamper-network

  # ==========================================
  # Prometheus (Metrics Collection)
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: stamper-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - stamper-network

  # ==========================================
  # Grafana (Dashboards)
  # ==========================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: stamper-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - stamper-network

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  backend_models:

# ==========================================
# Networks
# ==========================================
networks:
  stamper-network:
    driver: bridge